name: CI
on: [push]
jobs:
  tests:
    name: "Decentralised-Voting-Platforms-"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      - name: "Check contract syntax"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check contracts/voting-analytics.clar
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: "Run tests"
        run: |
          npm test
          npm run lint
          npm run typecheck
